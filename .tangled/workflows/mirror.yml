# .tangled/workflows/mirror.yml
when:
  - event: ["push"]
    branch: ["main"]

engine: "nixery"

clone:
  depth: 0

dependencies:
  nixpkgs:
    - git

steps:
  - name: "Mirror to a different CI Repository"
    command: |
      git remote add gitlab https://oauth2:$ACCESS_TOKEN@$GIT_REPOSITORY
      git push gitlab HEAD:refs/heads/mirror/main --force
